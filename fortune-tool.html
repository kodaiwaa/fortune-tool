<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f9f7;color:#1a1a1a;padding:2rem 1rem}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:.5rem;text-align:center}
.subtitle{font-size:13px;color:#888;text-align:center;margin-bottom:.5rem}
.disclaimer{font-size:11px;color:#bbb;text-align:center;margin-bottom:1.5rem;line-height:1.6}
.progress{height:4px;background:#eee;border-radius:2px;margin-bottom:1.5rem}
.progress-bar{height:4px;background:#1a73e8;border-radius:2px;transition:width .3s}
.q-label{font-size:11px;color:#999;margin-bottom:.5rem}
.q-text{font-size:16px;font-weight:500;margin-bottom:1.2rem;line-height:1.6}
.choices{display:flex;flex-direction:column;gap:10px;margin-bottom:1.5rem}
.choice{padding:14px 16px;border:1px solid #ddd;border-radius:10px;background:#fff;cursor:pointer;font-size:14px;line-height:1.5;transition:all .15s;text-align:left}
.choice:hover{border-color:#1a73e8;background:#f0f4ff}
.choice.selected{border-color:#1a73e8;background:#e8f0fe;color:#1a73e8}
.nav{display:flex;justify-content:space-between;align-items:center}
.btn{height:40px;padding:0 20px;border:1px solid #ddd;border-radius:8px;background:#fff;font-size:14px;cursor:pointer;transition:background .15s}
.btn:hover{background:#f0f0f0}
.btn-primary{background:#1a73e8;color:#fff;border-color:#1a73e8}
.btn-primary:hover{background:#1557b0}
.result{display:none}
.type-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.5rem;margin-bottom:12px}
.type-name{font-size:24px;font-weight:600;margin-bottom:.5rem}
.type-tag{display:inline-block;font-size:12px;padding:3px 12px;border-radius:6px;background:#e8f0fe;color:#1a73e8;margin-bottom:1rem}
.type-desc{font-size:14px;color:#444;line-height:1.8;margin-bottom:1rem}
.traits{display:flex;flex-wrap:wrap;gap:6px}
.trait{font-size:12px;padding:3px 12px;border-radius:20px;background:#f5f5f5;color:#555;border:1px solid #e0e0e0}
.meisei-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:12px}
.meisei-card h3{font-size:14px;font-weight:500;color:#888;margin-bottom:.75rem}
.nichi-val{font-size:14px;line-height:1.7}
.share-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:12px}
.share-card h3{font-size:14px;font-weight:500;color:#555;margin-bottom:.5rem}
.share-card p{font-size:12px;color:#888;line-height:1.6;margin-bottom:.75rem}
.share-text{width:100%;min-height:190px;border:1px solid #ddd;border-radius:10px;background:#fafafa;color:#333;font-size:13px;line-height:1.65;padding:12px;resize:vertical;margin-bottom:.75rem}
.share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.share-actions .btn{width:100%}
.cta{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;text-align:center}
.cta p{font-size:13px;color:#666;margin-bottom:.75rem;line-height:1.6}
.cta a{display:inline-block;padding:10px 24px;background:#1a1a1a;color:#fff;border-radius:8px;font-size:13px;text-decoration:none}
.birthday-section{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:12px}
.birthday-section h3{font-size:14px;font-weight:500;color:#888;margin-bottom:.75rem}
.birthday-row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:10px}
label{font-size:12px;color:#888;display:block;margin-bottom:4px}
input[type=number]{width:100%;height:36px;padding:0 10px;border:1px solid #ddd;border-radius:8px;font-size:14px;background:#fff}
.skip-link{font-size:12px;color:#aaa;text-decoration:underline;cursor:pointer;display:block;text-align:center;margin-top:.5rem}
</style>
</head>
<body>
<div class="wrap">
  <h1>動き方タイプ診断</h1>
  <p class="subtitle">AI自己分析ツール｜タイプ×四柱推命</p>
  <p class="disclaimer">※本ツールは独自の自己分析ツールです。公式の「動物占い」「動物キャラナビ」「個性心理學」とは無関係で、それらの分類・換算表・ロジックは使用していません。</p>

  <div id="quiz-section">
    <div class="progress"><div class="progress-bar" id="prog" style="width:0%"></div></div>
    <div class="q-label" id="q-label">Q1 / 8</div>
    <div class="q-text" id="q-text"></div>
    <div class="choices" id="choices"></div>
    <div class="nav">
      <button class="btn" id="btn-back" onclick="goBack()" style="display:none">← 戻る</button>
      <span></span>
      <button class="btn btn-primary" id="btn-next" onclick="goNext()" disabled>次へ →</button>
    </div>
  </div>

  <div id="birthday-section-wrap" style="display:none">
    <div class="birthday-section">
      <h3>（任意）生年月日を入力すると四柱推命メモが表示されます</h3>
      <div class="birthday-row">
        <div><label>年</label><input type="number" id="yr" min="1940" max="2010" placeholder="1989"></div>
        <div><label>月</label><input type="number" id="mo" min="1" max="12" placeholder="9"></div>
        <div><label>日</label><input type="number" id="dy" min="1" max="31" placeholder="22"></div>
      </div>
      <button class="btn btn-primary" style="width:100%" onclick="showResult()">結果を見る</button>
      <span class="skip-link" onclick="showResult()">生年月日は入力しない</span>
    </div>
  </div>

  <div class="result" id="result">
    <div class="type-card">
      <div class="type-name" id="r-name"></div>
      <div class="type-tag" id="r-tag"></div>
      <div class="type-desc" id="r-desc"></div>
      <div class="traits" id="r-traits"></div>
    </div>
    <div class="meisei-card" id="meisei-card" style="display:none">
      <h3>四柱推命メモ（日干）</h3>
      <div class="nichi-val" id="h-nichi"></div>
    </div>
    <div class="share-card">
      <h3>結果をシェアする</h3>
      <p>そのままコピーしてXに投稿できます。</p>
      <textarea class="share-text" id="share-text" readonly></textarea>
      <div class="share-actions">
        <button class="btn" id="share-copy-btn" onclick="copyShareText()">コピーする</button>
        <button class="btn btn-primary" onclick="openXShare()">Xでシェア</button>
      </div>
    </div>
    <div class="cta">
      <p>このタイプで止まりやすい時の話を、noteにまとめました。</p>
      <a href="#" id="cta-link">→ noteで読む</a>
    </div>
  </div>
</div>

<script>
const QUESTIONS=[
  {text:'新しいことに出会ったとき、まず何をしますか？',choices:[
    {text:'とりあえずやってみる',type:'突破行動型'},
    {text:'自分の感覚で「合う・合わない」を確かめる',type:'自由直感型'},
    {text:'情報を集めて、理解してから動く',type:'探求内省型'},
    {text:'周りの人の反応を見てから決める',type:'調和共感型'}
  ]},
  {text:'仕事や作業で一番得意なのは？',choices:[
    {text:'コツコツ続けること',type:'堅実積み上げ型'},
    {text:'アイデアを出すこと',type:'自由直感型'},
    {text:'人の間に入って進めること',type:'調和共感型'},
    {text:'クオリティを上げること',type:'美意識表現型'}
  ]},
  {text:'ミスをしたとき、まず何を考えますか？',choices:[
    {text:'次どう動くか',type:'突破行動型'},
    {text:'なぜ起きたか原因を掘り下げる',type:'探求内省型'},
    {text:'周りへの影響が気になる',type:'調和共感型'},
    {text:'同じミスをしない仕組みを作る',type:'堅実積み上げ型'}
  ]},
  {text:'理想の働き方に近いのは？',choices:[
    {text:'自分のペースで自由に動く',type:'自由直感型'},
    {text:'チームで助け合いながら進める',type:'調和共感型'},
    {text:'計画どおり着実に積み上げる',type:'堅実積み上げ型'},
    {text:'こだわった仕事を世に出す',type:'美意識表現型'}
  ]},
  {text:'褒められて一番嬉しいのは？',choices:[
    {text:'「センスがいい」',type:'美意識表現型'},
    {text:'「行動が早い」',type:'突破行動型'},
    {text:'「信頼できる」',type:'堅実積み上げ型'},
    {text:'「面白い発想だ」',type:'自由直感型'}
  ]},
  {text:'人間関係で大事にしていることは？',choices:[
    {text:'深く理解し合える関係',type:'探求内省型'},
    {text:'気持ちよく助け合える関係',type:'調和共感型'},
    {text:'お互い干渉しすぎない関係',type:'自由直感型'},
    {text:'一緒に何かを成し遂げる関係',type:'突破行動型'}
  ]},
  {text:'時間があるとき、自然にやることは？',choices:[
    {text:'気になることを深く調べる',type:'探求内省型'},
    {text:'新しい場所や体験に出かける',type:'突破行動型'},
    {text:'好きなものをとことん磨く',type:'美意識表現型'},
    {text:'誰かと話したり、つながる',type:'調和共感型'}
  ]},
  {text:'自分の一番の強みだと思うのは？',choices:[
    {text:'継続力・安定感',type:'堅実積み上げ型'},
    {text:'直感・発想力',type:'自由直感型'},
    {text:'分析・思考力',type:'探求内省型'},
    {text:'表現力・こだわり',type:'美意識表現型'}
  ]}
];

const TYPE_INFO={
  '自由直感型':{tag:'自由直感型',slug:'jiyuu-chokkan',desc:'ひらめきと余白を大切にする創造派。型にはまらず、自分の感覚を信じて動く。直感が鋭く、独自の発想で新しい道を切り開く。一方で、ルーティンや細かい管理が続くと息切れしやすい。',traits:['直感力','発想力','独自性','自由への欲求'],noteUrl:'https://note.com/legacy4future/n/ne2fbea970120',shareText:'命軸診断やってみたら「自由直感型」でした。\\n直感で動いて後から理由をつける、って\\n言われてみれば全部そうだった笑\\n枠に収まれない理由がわかった気がする。\\n▼無料で診断できます'},
  '堅実積み上げ型':{tag:'堅実積み上げ型',slug:'kenjitsu-tsumiage',desc:'コツコツと積み上げる力が武器。計画を立て、着実に前進する安定感がある。信頼を築くのが得意で、長期的な成果を出しやすい。変化や曖昧さが続くと消耗しやすい面もある。',traits:['継続力','計画性','安定感','信頼'],noteUrl:'https://note.com/legacy4future/n/n0fbece91bff5',shareText:'命軸診断、「堅実積み上げ型」でした。\\n派手な一発逆転より、地道に続ける方が\\n本当に自分に合ってるんだと腑に落ちた。\\n焦って動いてたの、無駄だったかも。\\n▼無料で診断できます'},
  '突破行動型':{tag:'突破行動型',slug:'toppa-koudou',desc:'スピードと実行力で場を動かす行動派。考えるより先に動き、エネルギーで壁を突き破る。チャレンジが好きで、停滞より失敗を選ぶタイプ。じっくり考える場面では焦りを感じやすい。',traits:['行動力','スピード','挑戦心','突破力'],noteUrl:'https://note.com/legacy4future/n/n7ecd2b413e9f',shareText:'命軸診断、「突破行動型」でした。\\n考えるより先に動いちゃう、って\\n長所でもあり短所でもあるって書いてあって刺さった。\\nもっとうまく使えそう。\\n▼無料で診断できます'},
  '調和共感型':{tag:'調和共感型',slug:'chouwa-kyoukan',desc:'人の気持ちを読む力と場をつなぐ力が強み。チームの潤滑油として自然に動き、人間関係を大切にする。頼まれると断れず、自分のペースを犠牲にしやすい面もある。',traits:['共感力','協調性','場づくり','気配り'],noteUrl:'https://note.com/legacy4future/n/nf3ea7b25bf56',shareText:'命軸診断やったら「調和共感型」でした。\\n場の空気を読みすぎて自分の意見が言えなくなる、\\nって傾向が完全に当たってた。\\n自覚するだけで少し楽になった。\\n▼無料で診断できます'},
  '探求内省型':{tag:'探求内省型',slug:'tankyuu-naisei',desc:'深く考え、本質を掘り下げることが得意。情報を集めて整理し、意味や構造を見つけるのが好き。静かな環境でじっくり取り組む場面で力を発揮する。表面的なやり取りは疲弊しやすい。',traits:['分析力','深掘り','思考力','内省'],noteUrl:'https://note.com/legacy4future/n/nd635c6075e4f',shareText:'命軸診断、「探求内省型」でした。\\n一人で深く考えるのが好きで\\nそれが強みでもあると書いてあって素直に嬉しかった。\\nちゃんと使い道があるんだな、と。\\n▼無料で診断できます'},
  '美意識表現型':{tag:'美意識表現型',slug:'bii-hyogen',desc:'感性とこだわりで世界に独自の価値を生み出すタイプ。クオリティへの執着が強く、「これでいい」に妥協できない。表現・発信・制作の場で際立った力を発揮する。完璧主義が足枷になることも。',traits:['感性','こだわり','表現力','美意識'],noteUrl:'https://note.com/legacy4future/n/n81ae646f80ea',shareText:'命軸診断、「美意識表現型」でした。\\nこだわるほど出せなくなる、って\\nまさに今の自分すぎて笑えなかった。\\n表現できない理由に名前がついた感じ。\\n▼無料で診断できます'}
};

const KAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const KAN_READ=['きのえ','きのと','ひのえ','ひのと','つちのえ','つちのと','かのえ','かのと','みずのえ','みずのと'];
const KAN_NATURE={
  '甲':'大木のエネルギー。まっすぐな上昇志向と正直さが本質。リーダーとして道を切り拓く力がある。',
  '乙':'しなやかな草木。柔軟性と適応力が高く、人間関係を大切にする。表向きは穏やかだが芯は強い。',
  '丙':'輝く太陽。明るく積極的で、周囲を照らす存在感がある。情熱的で行動力があるが、飽きやすい面も。',
  '丁':'灯火のエネルギー。繊細で温かく、人の心に寄り添う力がある。内側に強い信念を秘めている。',
  '戊':'大地の山。どっしりとした安定感と包容力。変化をゆっくり受け入れ、揺るぎない存在として周囲を支える。',
  '己':'耕された土。柔軟に周囲に合わせながら、実りをもたらす。思慮深く、人の気持ちに敏感。',
  '庚':'鋭い刃金。研ぎ澄まされた意志と感性。クールに見えるが芯は熱く、こだわりが強い。',
  '辛':'磨かれた宝石。繊細で美意識が高い。完成度へのこだわりと、傷つきやすい一面を持つ。',
  '壬':'大河の流れ。広大な視野と包容力。柔軟に流れながらも、力強く進む知性派。',
  '癸':'霧雨・地下水。繊細で深い感受性。直感力が高く、表に出にくいが内側に豊かな世界を持つ。'
};

let current=0;
const answers=[];
let currentResult=null;

function renderQ(){
  const q=QUESTIONS[current];
  document.getElementById('q-label').textContent='Q'+(current+1)+' / '+QUESTIONS.length;
  document.getElementById('q-text').textContent=q.text;
  document.getElementById('prog').style.width=((current/QUESTIONS.length)*100)+'%';
  const c=document.getElementById('choices');
  c.innerHTML='';
  q.choices.forEach((ch,i)=>{
    const btn=document.createElement('button');
    btn.className='choice'+(answers[current]===i?' selected':'');
    btn.textContent=ch.text;
    btn.onclick=()=>selectChoice(i);
    c.appendChild(btn);
  });
  document.getElementById('btn-back').style.display=current>0?'':'none';
  document.getElementById('btn-next').disabled=answers[current]===undefined;
  document.getElementById('btn-next').textContent=current===QUESTIONS.length-1?'結果へ →':'次へ →';
}

function selectChoice(i){
  answers[current]=i;
  document.querySelectorAll('.choice').forEach((b,j)=>b.classList.toggle('selected',j===i));
  document.getElementById('btn-next').disabled=false;
}

function goNext(){
  if(answers[current]===undefined)return;
  if(current<QUESTIONS.length-1){current++;renderQ();}
  else{document.getElementById('quiz-section').style.display='none';document.getElementById('birthday-section-wrap').style.display='';}
}

function goBack(){if(current>0){current--;renderQ();}}

function calcType(){
  const score={};
  answers.forEach((a,qi)=>{const t=QUESTIONS[qi].choices[a].type;score[t]=(score[t]||0)+1;});
  const lastType=QUESTIONS[QUESTIONS.length-1].choices[answers[QUESTIONS.length-1]].type;
  return Object.entries(score).sort((a,b)=>b[1]-a[1]||(a[0]===lastType?-1:b[0]===lastType?1:0))[0][0];
}

function getJulianDay(y,m,d){if(m<=2){y--;m+=12;}const A=Math.floor(y/100);const B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524;}
function getNichiKan(y,m,d){const jd=getJulianDay(y,m,d);const base=getJulianDay(1984,1,1);const diff=jd-base;const idx=((diff%10)+10)%10;return{kan:KAN[idx],read:KAN_READ[idx]};}

function showResult(){
  document.getElementById('birthday-section-wrap').style.display='none';
  const typeName=calcType();
  const info=TYPE_INFO[typeName];
  document.getElementById('r-name').textContent=typeName;
  document.getElementById('r-tag').textContent=info.tag;
  document.getElementById('r-desc').textContent=info.desc;
  const tr=document.getElementById('r-traits');
  tr.innerHTML='';
  info.traits.forEach(t=>{const s=document.createElement('span');s.className='trait';s.textContent=t;tr.appendChild(s);});
  const noteUrl=buildTrackedNoteUrl(info.noteUrl,info.slug);
  const ctaLink=document.getElementById('cta-link');
  ctaLink.href=noteUrl;
  ctaLink.onclick=function(e){e.preventDefault();trackNoteClick(typeName,info.slug,noteUrl);};
  currentResult={type:typeName,slug:info.slug,shareText:buildShareText(info)};
  document.getElementById('share-text').value=currentResult.shareText;

  const y=parseInt(document.getElementById('yr').value);
  const m=parseInt(document.getElementById('mo').value);
  const d=parseInt(document.getElementById('dy').value);
  if(y&&m&&d&&!isNaN(y)&&!isNaN(m)&&!isNaN(d)&&y>=1940&&y<=2010){
    const nichi=getNichiKan(y,m,d);
    document.getElementById('h-nichi').textContent='日干「'+nichi.kan+'（'+nichi.read+'）」— '+KAN_NATURE[nichi.kan];
    document.getElementById('meisei-card').style.display='';
  }

  document.getElementById('prog').style.width='100%';
  document.getElementById('result').style.display='block';

  // GA: 診断完了イベント
  gtag('event', 'diagnosis_complete', {type: typeName,type_slug: info.slug});
}

function buildTrackedNoteUrl(url,typeSlug){
  const trackedUrl=new URL(url);
  trackedUrl.searchParams.set('utm_source','fortune_tool');
  trackedUrl.searchParams.set('utm_medium','cta');
  trackedUrl.searchParams.set('utm_campaign','type_diagnosis');
  trackedUrl.searchParams.set('utm_content',typeSlug);
  return trackedUrl.toString();
}

function buildShareUrl(typeSlug){
  const url=new URL('https://kodaiwaa.github.io/fortune-tool/fortune-tool.html');
  url.searchParams.set('utm_source','x');
  url.searchParams.set('utm_medium','social');
  url.searchParams.set('utm_campaign','diagnosis_share');
  url.searchParams.set('utm_content',typeSlug);
  return url.toString();
}

function buildShareText(info){
  return info.shareText.replace(/\\n/g,'\n')+'\n'+buildShareUrl(info.slug);
}

function copyShareText(){
  if(!currentResult)return;
  const btn=document.getElementById('share-copy-btn');
  const setCopied=()=>{
    btn.textContent='コピーしました✓';
    setTimeout(()=>{btn.textContent='コピーする';},2000);
  };
  gtag('event','share_copy_click',{type:currentResult.type,type_slug:currentResult.slug});
  navigator.clipboard.writeText(currentResult.shareText).then(setCopied).catch(()=>{
    const ta=document.createElement('textarea');
    ta.value=currentResult.shareText;
    ta.style.position='fixed';
    ta.style.opacity='0';
    document.body.appendChild(ta);
    ta.select();
    document.execCommand('copy');
    document.body.removeChild(ta);
    setCopied();
  });
}

function openXShare(){
  if(!currentResult)return;
  gtag('event','share_x_click',{type:currentResult.type,type_slug:currentResult.slug});
  const shareUrl='https://twitter.com/intent/tweet?text='+encodeURIComponent(currentResult.shareText);
  window.open(shareUrl,'_blank','noopener,noreferrer');
}

function trackNoteClick(typeName,typeSlug,url){
  // GA: note CTAクリックイベント
  gtag('event', 'note_cta_click', {type: typeName,type_slug: typeSlug});
  window.open(url, '_blank');
}

renderQ();
</script>
