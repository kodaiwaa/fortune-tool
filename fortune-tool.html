<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>動物占い＋四柱推命 鑑定ツール</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f9f9f7;color:#1a1a1a;padding:2rem 1rem}
.wrap{max-width:600px;margin:0 auto}
h1{font-size:20px;font-weight:500;margin-bottom:1.5rem;text-align:center}
.row{display:grid;grid-template-columns:1fr 1fr 1fr;gap:12px;margin-bottom:16px}
label{font-size:13px;color:#666;display:block;margin-bottom:6px}
input[type=number]{width:100%;height:36px;padding:0 10px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-size:14px}
.gender-row{display:flex;gap:10px;margin-bottom:20px}
.gender-btn{flex:1;height:36px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#666;cursor:pointer;font-size:14px;transition:all .15s}
.gender-btn.active{background:#e8f0fe;color:#1a73e8;border-color:#1a73e8}
button#calc{width:100%;height:40px;border:1px solid #ddd;border-radius:8px;background:#fff;color:#1a1a1a;font-size:15px;cursor:pointer;margin-bottom:1.5rem;transition:background .15s}
button#calc:hover{background:#f0f0f0}
.result{display:none}
.animal-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:12px}
.animal-card h2{font-size:22px;font-weight:500;margin-bottom:4px}
.tag{display:inline-block;font-size:12px;padding:3px 10px;border-radius:6px;margin-right:6px;margin-bottom:8px}
.tag-animal{background:#e6f4ea;color:#1e7e34}
.tag-group{background:#e8f0fe;color:#1a73e8}
.desc{font-size:14px;color:#555;line-height:1.7;margin-bottom:10px}
.traits{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.trait{font-size:12px;padding:3px 10px;border-radius:20px;background:#f5f5f5;color:#555;border:1px solid #e0e0e0}
.meisei-card{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem;margin-bottom:12px}
.meisei-card h3{font-size:15px;font-weight:500;margin-bottom:12px}
.pillars{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.pillar{background:#f9f9f7;border-radius:8px;padding:10px;text-align:center}
.pillar-name{font-size:11px;color:#999;margin-bottom:6px}
.pillar-kan{font-size:18px;font-weight:500}
.pillar-shi{font-size:14px;color:#555;margin-top:2px}
.pillar-read{font-size:11px;color:#999;margin-top:3px}
.honshitsu{background:#fff;border:1px solid #eee;border-radius:12px;padding:1.25rem}
.honshitsu h3{font-size:15px;font-weight:500;margin-bottom:10px}
.honshitsu-item{display:flex;gap:10px;margin-bottom:10px;align-items:flex-start}
.honshitsu-label{font-size:12px;color:#888;min-width:60px;padding-top:2px}
.honshitsu-val{font-size:14px;line-height:1.6}
.error{color:#c0392b;font-size:14px;padding:8px 0}
</style>
</head>
<body>
<div class="wrap">
<h1>動物占い＋四柱推命 鑑定</h1>
<div class="row">
  <div><label>年</label><input type="number" id="yr" min="1960" max="2022" placeholder="1989"></div>
  <div><label>月</label><input type="number" id="mo" min="1" max="12" placeholder="9"></div>
  <div><label>日</label><input type="number" id="dy" min="1" max="31" placeholder="22"></div>
</div>
<label style="margin-bottom:6px">性別</label>
<div class="gender-row">
  <button class="gender-btn active" id="g-m" onclick="setGender('男性')">男性</button>
  <button class="gender-btn" id="g-f" onclick="setGender('女性')">女性</button>
</div>
<button id="calc" onclick="calc()">鑑定する</button>
<div id="err" class="error"></div>
<div class="result" id="result">
  <div class="animal-card">
    <h2 id="r-chara"></h2>
    <div><span class="tag tag-animal" id="r-animal"></span><span class="tag tag-group" id="r-group"></span></div>
    <div class="desc" id="r-desc"></div>
    <div class="traits" id="r-traits"></div>
  </div>
  <div class="meisei-card">
    <h3>四柱推命 命式</h3>
    <div class="pillars">
      <div class="pillar"><div class="pillar-name">年柱</div><div class="pillar-kan" id="p-y-kan"></div><div class="pillar-shi" id="p-y-shi"></div><div class="pillar-read" id="p-y-read"></div></div>
      <div class="pillar"><div class="pillar-name">月柱</div><div class="pillar-kan" id="p-m-kan"></div><div class="pillar-shi" id="p-m-shi"></div><div class="pillar-read" id="p-m-read"></div></div>
      <div class="pillar"><div class="pillar-name">日柱</div><div class="pillar-kan" id="p-d-kan"></div><div class="pillar-shi" id="p-d-shi"></div><div class="pillar-read" id="p-d-read"></div></div>
    </div>
  </div>
  <div class="honshitsu">
    <h3>簡易読み解き</h3>
    <div class="honshitsu-item"><div class="honshitsu-label">日干の本質</div><div class="honshitsu-val" id="h-nichi"></div></div>
    <div class="honshitsu-item"><div class="honshitsu-label">総合メモ</div><div class="honshitsu-val" id="h-sogo"></div></div>
  </div>
</div>
</div>

<script>

const ANIMAL_INFO={
  'チータ':{group:'太陽グループ',desc:'行動力と推進力が際立つ。スピード感を持って物事を進め、目標に向かってひたすら走り続けるタイプ。',traits:['行動力','スピード感','直感的','負けず嫌い']},
  'たぬき':{group:'月グループ',desc:'社交性が高く、人を引き込む魅力がある。表向きは穏やかだが内側は戦略的で、物事をうまくまとめる力を持つ。',traits:['社交的','策略家','親しみやすい','記憶力']},
  '猿':{group:'地球グループ',desc:'好奇心旺盛で学習能力が高い。柔軟に環境に適応し、多彩な才能を発揮するが、飽きやすい面も。',traits:['好奇心旺盛','適応力','多才','飽きっぽい']},
  'コアラ':{group:'月グループ',desc:'ゆったりとした独自のペースで生きるタイプ。こだわりと感性が強く、自分の世界観を大切にする。',traits:['マイペース','こだわり','感性豊か','独自の世界']},

  'ゾウ':{group:'地球グループ',desc:'包容力と記憶力が高く、信頼される存在。コツコツと積み上げる粘り強さがあり、長期的な成功に向いている。',traits:['包容力','記憶力','粘り強い','信頼感']},

  'ペガサス':{group:'太陽グループ',desc:'自由な発想と独自の世界観を持つ夢追い人。直感力が鋭く、創造的なアイデアを生み出す。束縛が苦手。',traits:['自由な発想','直感的','創造力','束縛が苦手']},

};

const KAN=['甲','乙','丙','丁','戊','己','庚','辛','壬','癸'];
const SHI=['子','丑','寅','卯','辰','巳','午','未','申','酉','戌','亥'];
const KAN_READ=['きのえ','きのと','ひのえ','ひのと','つちのえ','つちのと','かのえ','かのと','みずのえ','みずのと'];
const SHI_READ=['ね','うし','とら','う','たつ','み','うま','ひつじ','さる','とり','いぬ','い'];
const KAN_NATURE={
  '甲':'大木のエネルギー。まっすぐな上昇志向と正直さが本質。リーダーとして道を切り拓く力がある。',
  '乙':'しなやかな草木。柔軟性と適応力が高く、人間関係を大切にする。表向きは穏やかだが芯は強い。',

function getJulianDay(y,m,d){if(m<=2){y--;m+=12;}const A=Math.floor(y/100);const B=2-A+Math.floor(A/4);return Math.floor(365.25*(y+4716))+Math.floor(30.6001*(m+1))+d+B-1524;}
function getKanShi(y,m,d){const jd=getJulianDay(y,m,d);const base=getJulianDay(1984,1,1);const diff=jd-base;const kanIdx=((diff%10)+10)%10;const shiIdx=((diff%12)+12)%12;return{kan:KAN[kanIdx],shi:SHI[shiIdx],kanRead:KAN_READ[kanIdx],shiRead:SHI_READ[shiIdx]};}

function getAnimalNo(y,m,d){
  const row=TABLE[y];
  if(!row)return null;
  const code=row[m-1];
  let no=code+d;
  if(no>60)no-=60;
  if(no===0)no=60;
  return no;
}

function getAnimalFromChara(chara){
  for(const a of Object.keys(ANIMAL_INFO)){if(chara.includes(a))return a;}
  return null;
}

function calc(){
  document.getElementById('err').textContent='';
  document.getElementById('result').style.display='none';
  const y=parseInt(document.getElementById('yr').value);
  const m=parseInt(document.getElementById('mo').value);
  const d=parseInt(document.getElementById('dy').value);
  if(!y||!m||!d||isNaN(y)||isNaN(m)||isNaN(d)){document.getElementById('err').textContent='生年月日を正しく入力してください。';return;}
  if(!TABLE[y]){document.getElementById('err').textContent='対応範囲は1960〜2022年です。';return;}
  if(m<1||m>12||d<1||d>31){document.getElementById('err').textContent='月・日の値が範囲外です。';return;}

  const no=getAnimalNo(y,m,d);
  if(!no){document.getElementById('err').textContent='計算できませんでした。';return;}
  const chara=CHARA[no]||'不明';
  const animal=getAnimalFromChara(chara);
  const info=animal?ANIMAL_INFO[animal]:{group:'不明',desc:'',traits:[]};

  document.getElementById('r-chara').textContent=chara;
  document.getElementById('r-animal').textContent=animal||'';
  document.getElementById('r-group').textContent=info.group;
  document.getElementById('r-desc').textContent=info.desc;
  const tr=document.getElementById('r-traits');
  tr.innerHTML='';
  info.traits.forEach(t=>{const s=document.createElement('span');s.className='trait';s.textContent=t;tr.appendChild(s);});

  const nen=getKanShi(y,1,1);
  const nichi=getKanShi(y,m,d);
  const mKanShi=getKanShi(y,m,1);

  document.getElementById('p-y-kan').textContent=nen.kan;
  document.getElementById('p-y-shi').textContent=nen.shi;
  document.getElementById('p-y-read').textContent=nen.kanRead+'・'+nen.shiRead;
  document.getElementById('p-m-kan').textContent=mKanShi.kan;
  document.getElementById('p-m-shi').textContent=mKanShi.shi;
  document.getElementById('p-m-read').textContent=mKanShi.kanRead+'・'+mKanShi.shiRead;
  document.getElementById('p-d-kan').textContent=nichi.kan;
  document.getElementById('p-d-shi').textContent=nichi.shi;
  document.getElementById('p-d-read').textContent=nichi.kanRead+'・'+nichi.shiRead;

  document.getElementById('h-nichi').textContent=KAN_NATURE[nichi.kan]||'';
  document.getElementById('h-sogo').textContent='日干「'+nichi.kan+'（'+nichi.kanRead+'）」が本質。動物占いの「'+chara+'」とあわせると、'+info.desc;

  document.getElementById('result').style.display='block';
}
</script>
